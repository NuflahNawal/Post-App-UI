<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/b3614e4fbc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar md:navbar-expand nav bgColor">
        <div class="container">
            <a class="navbar-brand fs-xl" href="#"><strong>PostHub</strong></a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html"><b>Home</b></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="post.html"><i class="fa-solid fa-plus"></i><b>Post</b></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="signUp.html"><b>SignUp / LogIn</b></a>
                        </li>
                        <!-- <li>
                            <i class="fa-solid fa-circle-half-stroke mode" onclick="changeMode(this)"></i>
                        </li> -->
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <div class="container">
        <div class="heading">
            <h4><em>"We’d love to see your take! Hit post and let everyone know what you’re up to."</em></h4>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-5 col-lg-4 mt-2">
                <div class="card p-3 color">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label"><b class="head">Title</b></label>
                        <input type="text" class="form-control" id="title" placeholder="Enter your Title here:">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label"><b class="head">Description</b></label>
                        <textarea class="form-control" id="desc" rows="3"
                            placeholder="What's On your mind..."></textarea>
                    </div>
                    <div class="mb-4 mt-2 d-flex justify-content-around">
                        <img class="postImg" onclink="selectImg('Image/1.webp')" src="Image/1.webp" alt="">
                        <img class="postImg" onclink="selectImg('Image/2.jpg')" src="Image/2.jpg" alt="">
                        <img class="postImg" onclink="selectImg('Image/3.webp')" src="Image/3.webp" alt="">
                        <img class="postImg" onclink="selectImg('Image/4.jpg')" src="Image/4.jpg" alt="">
                        <img class="postImg" onclink="selectImg('Image/5.avif')" src="Image/5.avif" alt="">
                        <img class="postImg" onclink="selectImg('Image/6.avif')" src="Image/6.avif" alt="">
                    </div>

                    <button class="btn text-light postBtn" onclick="post()">Post</button>
                </div>
            </div>
        </div>
    </div>

    

        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
        <script src="app.js"></script>
</body>

</html>
