    <div class="container">
        <div class="heading">
            <h4><em>"Don’t just scroll drop your thoughts, updates, or latest wins here!"</em></h4>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-7 col-lg-8" id="postContainer">
            </div>


            <div class="col-12 col-md-5 col-lg-4 m-4">
                <div class="mb-3">
                    <div class="card">
                        <div class="card-header headingColor">
                            @blog
                        </div>
                        <div class="card-body color">
                            <div class="title">
                                <b>Why Building Small Projects Is the Fastest Way to Learn</b>
                            </div>
                            <figure>
                                <blockquote class="blockquote">
                                    <p>Watching tutorials feels productive, until you open a blank editor and realize you don’t know where to start. That gap only closes when you start building things on your own—even if they’re tiny. <br>

                                    Start with something simple like a basic calculator, a to-do list, or a personal landing page. You’ll run into broken layouts, unexpected bugs, and moments of pure frustration—and that’s the exact part where real learning happens. Every small project you finish gives you the confidence to tackle the next one.</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    Zainab Malik | Date: November 19, 2026 
                                </figcaption>
                            </figure>
                            
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-5 col-lg-4 m-4">
                <div class="mb-3">
                    <div class="card">
                        <div class="card-header headingColor">
                            @blog
                        </div>
                        <div class="card-body color">
                            <div class="title">
                                <b>A Weekend Escape to the Northern Mountains</b>
                            </div>
                            <figure>
                                <blockquote class="blockquote">
                                    <p>Sometimes all you need is fresh mountain air and zero Wi-Fi to reset your mind. Last weekend, I packed a small backpack and headed north to explore quiet trails, wooden cabins, and steaming cups of chai overlooking misty valleys. <br>

                                    The best part wasn’t even the famous viewpoints—it was the slow mornings, friendly locals, and realizing how little we actually need to feel completely at peace. If you’ve been feeling burned out lately, consider this your sign to plan a short getaway.</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    Hamza Tariq | Date: November 12, 2026
                                </figcaption>
                            </figure>
                            
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-5 col-lg-4 m-4">
                <div class="mb-3">
                    <div class="card">
                        <div class="card-header headingColor">
                            @blog
                        </div>
                        <div class="card-body color">
                            <figure>
                                <div class="title">
                                    <b>5 Simple Habits That Made Me a Better Developer </b>
                                </div>
                                <blockquote class="blockquote">
                                    <p>Writing clean code isn’t about knowing every complex trick—it’s about consistency. Over the past few months, breaking big problems into tiny steps, naming my files properly, and taking short breaks when stuck completely changed how I build projects. Whether you’re just starting out or debugging your tenth project, keeping things simple always wins.</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    Sara Ahmed | Date: November 18, 2026
                                </figcaption>
                            </figure>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
